site:
  name: Globular Cluster Technology Software Limited
  site: 'https://globularcluster.ca'
  base: '/'
  trailingSlash: true

# Default SEO metadata
metadata:
  title:
    default: Globular Cluster Technology Software Limited
    template: '%s — Globular Cluster'
  description: 'AI consulting, cloud cost optimization and IT operations for businesses — from strategy to production.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Globular Cluster Technology Software Limited
    images:
      - url: '~/assets/images/og.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'dark' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
